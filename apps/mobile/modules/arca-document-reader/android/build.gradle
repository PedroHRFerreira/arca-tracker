plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.arcadocumentreader'
version = '1.0.0'

android {
  namespace "expo.modules.arcadocumentreader"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
